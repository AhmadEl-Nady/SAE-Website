{% extends "base.html" %}
{% block title %}{{ article.title[lang] }} — {{ t.site_name }}{% endblock %}

{% block content %}
<article class="article">
  <div class="shell shell-narrow">
    <p class="news-meta">
      <time datetime="{{ article.date }}">{{ article.date }}</time>
      <span class="news-sector">{{ article.sector[lang] }}</span>
    </p>
    <h1 class="article-title">{{ article.title[lang] }}</h1>
    <p class="article-lead">{{ article.summary[lang] }}</p>
    <p class="article-body">{{ article.body[lang] }}</p>
    <a class="text-link" href="{{ url_for('news_list', lang=lang) }}">{{ t.back }}</a>
  </div>
</article>
{% endblock %}
