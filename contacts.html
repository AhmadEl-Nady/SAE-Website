{% extends "base.html" %}
{% block title %}{{ t.contact_title }} — {{ t.site_name }}{% endblock %}

{% block content %}
<section class="page-head">
  <div class="shell">
    <h1 class="page-title">{{ t.contact_title }}</h1>
    <p class="page-intro">{{ t.address }}</p>
  </div>
</section>

<section class="form-section">
  <div class="shell shell-narrow">
    {% if sent %}
      <p class="notice">{{ t.contact_sent }}</p>
    {% endif %}

    <form class="form" method="post">
      <label class="field">
        <span class="field-label">{{ t.contact_name }}</span>
        <input type="text" name="name" required>
      </label>

      <label class="field">
        <span class="field-label">{{ t.contact_email }}</span>
        <input type="email" name="email" required>
      </label>

      <label class="field">
        <span class="field-label">{{ t.contact_message }}</span>
        <textarea name="message" rows="6" required></textarea>
      </label>

      <button class="button" type="submit">{{ t.contact_send }}</button>
    </form>
  </div>
</section>
{% endblock %}
